name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ⭐ 自动识别并解压 ZIP 文件(保留原始逻辑)
      - name: Auto-detect and unzip ZIP file
        id: unzip
        run: |
          # 查找根目录下的第一个 .zip 文件
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 未找到任何 .zip 文件"
            exit 1
          fi
          echo "✅ 找到 ZIP 文件: $ZIP_FILE"
          echo "ZIP_NAME=$ZIP_FILE" >> $GITHUB_OUTPUT

          # 解压(-o 覆盖,-d . 解压到当前目录)
          unzip -o "$ZIP_FILE" -d .
          echo "✅ 解压完成"

      # 用仓库根目录的 QuantApp.kt 覆盖解压出来的旧文件(如果存在)
      - name: Replace QuantApp.kt if exists
        run: |
          if [ -f ./QuantApp.kt ]; then
            # 自动查找解压后的 app 源码路径(项目可能嵌套在子目录,不限深度)
            TARGET=$(find . -path "*/app/src/main/java/com/quant/app/ui/QuantApp.kt" 2>/dev/null | head -1)
            if [ -n "$TARGET" ]; then
              cp -v ./QuantApp.kt "$TARGET"
              echo "✅ 已覆盖 $TARGET"
            else
              echo "⚠️ 未找到目标 QuantApp.kt,跳过覆盖"
            fi
          else
            echo "⚠️ 仓库根目录没有 QuantApp.kt,使用 ZIP 中的原始版本"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
分布: temurin
java版: '17'

      - 姓名: 安装Android SDK
uses: android-actions/setup-android@v3

      - 姓名: 安装SDK组件
跑: |
yes|sdkmanager--licenses>/dev/null||true
sdkmanager"平台；android-35""构建工具；35.0.0""平台工具"

      - 姓名: 设置渐变
uses: gradle/操作/设置-gradle@v4
和……一起:
gradle-version: '8.9'

      #定位工程根目录并构建调试安装包
      - 姓名: 生成调试安装包
身份标识: 建立
跑: |
set-e
#寻找settings.gradle(支持嵌套)
根=""
if[-f settings.gradle.kts]||[-f settings.Gradle]；然后
根="。"
          else
            FOUND=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              ROOT=$(dirname "$FOUND")
Fi
Fi

如果[-z"$ROOT" ]；然后
回声"❌ 未找到settings.gradle，请确认ZIP包含安卓工程"
