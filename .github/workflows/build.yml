name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ⭐ 自动识别并解压 ZIP 文件
      - name: Auto-detect and unzip ZIP file
        id: unzip
        run: |
          # 查找根目录下的第一个 .zip 文件
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 未找到任何 .zip 文件"
            exit 1
          fi
          echo "✅ 找到 ZIP 文件: $ZIP_FILE"
          echo "ZIP_NAME=$ZIP_FILE" >> $GITHUB_OUTPUT

          # 解压（-o 覆盖，-d . 解压到当前目录）
          unzip -o "$ZIP_FILE" -d .
          echo "✅ 解压完成"

      # 用仓库根目录的 QuantApp.kt 覆盖解压出来的旧文件（如果存在）
      - name: Replace QuantApp.kt if exists
        run: |
          if [ -f ./QuantApp.kt ]; then
            # 自动查找解压后的 app 源码路径（最多两层）
            TARGET=$(find . -maxdepth 3 -path "*/app/src/main/java/com/quant/app/ui/QuantApp.kt" 2>/dev/null | head -1)
            if [ -n "$TARGET" ]; then
              cp -v ./QuantApp.kt "$TARGET"
              echo "✅ 已覆盖 $TARGET"
            else
              echo "⚠️ 未找到目标 QuantApp.kt，跳过覆盖"
            fi
          else
            echo "⚠️ 仓库根目录没有 QuantApp.kt，使用 ZIP 中的原始版本"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 清理缓存并自动定位工程根目录构建
      - name: Build Debug APK
        id: build
        run: |
          set -e
          # 寻找 settings.gradle（支持嵌套）
          ROOT=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="."
          else
            FOUND=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              ROOT=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "❌ 未找到 settings.gradle，请确认 ZIP 包含 Android 工程"
            exit 1
          fi

          echo "✅ 工程根目录: $ROOT"
          cd "$ROOT"

          # 清除 Gradle 缓存
          rm -rf .gradle
          rm -rf ~/.gradle/caches/

          # 构建
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --refresh-dependencies
          else
            gradle clean assembleDebug --stacktrace --refresh-dependencies
          fi

          # 收集 APK
          APK=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ 未找到 APK"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quant-app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
