          fi

      # 还原正式签名 keystore(4 个 Secret 齐全才启用,否则 Release 用 debug 签名兜底)
      - name: Restore signing keystore
        env:
          HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_PWD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
姓名
        run: |
          if [ "$HAS_KEY" = "true" ] && [ "$HAS_PWD" = "true" ] && [ "$HAS_ALIAS" = "true" ] && [ "$HAS_KPWD" = "true" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ env.PROJECT_ROOT }}/keystore.jks"
            echo "KEYSTORE_PATH=${{ env.PROJECT_ROOT }}/keystore.jks" >> $GITHUB_ENV
            echo "✅ 已还原正式签名 keystore"
          else
            echo "⚠️ 签名 Secret 未完整配置,Release 将使用 debug 签名"
          fi

      # 构建 Release APK(正式签名或 debug 兜底)
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
        working-directory: ${{env.PROJECT_ROOT}}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 收集 APK(Debug 必出,Release 可选)
      - name: Collect APKs
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
debug_APK=$(查找“”${{env.PROJECT_ROOT}}"-path"*/outputs/apk/debug/*.apk"-type f|head-1)
release_APK=$(查找“”${{env.PROJECT_ROOT}}"-path"*/outputs/apk/release/*.apk"-type f|head-1)
          if [ -z "$DEBUG_APK" ]; then
            echo "❌ 未找到 Debug APK"
            exit 1
          fi
          cp "$DEBUG_APK" "$GITHUB_WORKSPACE/artifacts/app-debug.apk"
          echo "✅ Debug APK: $DEBUG_APK"
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "$GITHUB_WORKSPACE/artifacts/app-release.apk"
            echo "✅ Release APK: $RELEASE_APK"
          else
            echo "⚠️ 未找到 Release APK,跳过"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quant-app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quant-app-release
          path: artifacts/app-release.apk
